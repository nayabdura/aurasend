<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Envelope shape -->
  <rect x="18" y="32" width="64" height="44" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Envelope flap lines -->
  <polyline points="18,38 50,58 82,38" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lightning bolt (AuraSend symbol) -->
  <polygon points="55,22 43,50 52,50 45,78 63,45 53,45 60,22" fill="url(#bolt)" opacity="0.95"/>
</svg>
